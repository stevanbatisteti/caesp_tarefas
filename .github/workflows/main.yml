name: Bot CAESP Diario

on:
  schedule:
    # 18:00 UTC = 15:00 Horário de Brasília
    - cron: '0 18 * * *'
  push:
    branches: [ main, master ] # Agora ele roda sempre que você salvar algo!
  workflow_dispatch: # Mantém o botão de rodar manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run:
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager requests google-auth-oauthlib google-api-python-client
        
      - name: Run Bot
        env:
        # Aqui o GitHub pega a Secret e transforma em uma variável que o Python lê
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python Monitor_de_Tarefas.py
