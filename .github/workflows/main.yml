name: Bot CAESP Diario

on:
  schedule:
    # 18:00 UTC = 15:00 Horário de Brasília
    - cron: '0 18 * * *'
  push:
    branches: [ main, master ] # Agora ele roda sempre que você salvar algo!
  workflow_dispatch: # Mantém o botão de rodar manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install selenium webdriver-manager requests

      - name: Run Bot
        run: python Monitor_de_Tarefas.py
